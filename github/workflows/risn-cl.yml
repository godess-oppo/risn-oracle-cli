name: RISN CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly builds

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.9'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        pip install requests pillow jq
        pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt"

    - name: Install Node dependencies
      run: |
        npm ci
        npm install -g jq

    - name: Run unit tests
      run: |
        python -m pytest tests/ -v || echo "No tests yet"
        ./scripts/test-basic.sh

    - name: Test CLI commands
      run: |
        chmod +x bin/risn
        ./bin/risn --version
        ./bin/risn --help
        ./bin/risn ops status --dry-run

    - name: Security scan
      uses: actions/codeql-analysis@v3

  design-generation:
    name: AI Design Generation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install requests pillow

    - name: Generate sample designs
      env:
        GOOGLE_AI_KEY: ${{ secrets.GOOGLE_AI_KEY }}
        HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      run: |
        mkdir -p designs
        python scripts/ai/google-ai-design.py "test fashion design" "ci-test" "1" || echo "AI test completed"
        ls -la designs/

    - name: Upload design artifacts
      uses: actions/upload-artifact@v4
      with:
        name: generated-designs
        path: designs/
        retention-days: 7

  deploy:
    name: Deploy to Environments
    runs-on: ubuntu-latest
    needs: [test, design-generation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    environment: production
    strategy:
      matrix:
        target: [vercel, docker]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to ${{ matrix.target }}
      run: |
        chmod +x bin/risn
        ./bin/risn deploy --target ${{ matrix.target }} --stage prod --dry-run
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# RISN GitHub Actions CI/CD Pipeline
name: RISN CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node bin/risn test
      
  audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node bin/risn audit "CI content check"
      
  deploy:
    runs-on: ubuntu-latest
    needs: [test, audit]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: RISN_POLICY_ACCEPT=true node bin/risn deploy --policy-accept
        env:
          MEDUSA_URL: ${{ secrets.MEDUSA_URL }}
          MEDUSA_API_KEY: ${{ secrets.MEDUSA_API_KEY }}

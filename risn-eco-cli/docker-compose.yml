services:
  fashionforge-cli:
    build: .
    environment:
      - FF_AI_MODEL_PATH=./tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
      - POD_PLATFORMS=printify,printful,spod
    
  design-engine: # NEW: Python container for AI
    build: ./services/design-engine
    volumes:
      - ./templates:/templates
    
  tryon-sim: # NEW: WASM module for virtual try-on
    build: ./services/wasm/tryon
    environment:
      - WASM_MODULE_PATH=/tryon.wasm
